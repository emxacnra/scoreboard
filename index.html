

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090b10">
  <title>Scoreboard</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --surface: #11151d;
      --surface2: #191f2a;
      --text: #f5f7ff;
      --muted: #8c96a8;
      --border: #293344;
      --accent: #38bdf8;
      --button: #202938;
    }

    body.light {
      color-scheme: light;
      --bg: #f1f4f9;
      --surface: #ffffff;
      --surface2: #e8edf5;
      --text: #131a27;
      --muted: #657084;
      --border: #d1d9e6;
      --accent: #087fc0;
      --button: #e0e7f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
      transition: background .25s, color .25s;
    }

    header {
      padding: 18px 10px 12px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .settings {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
      padding: 4px 12px 14px;
    }

    .label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input, button, select { font: inherit; }

    #target {
      width: 65px;
      padding: 8px;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      text-align: center;
      font-size: 16px;
    }

    .teams {
      display: flex;
      gap: 10px;
      padding: 0 10px;
      height: clamp(280px, 49vh, 480px);
    }

    .team {
      --team-color: #1680ff;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px 7px;
      border-radius: 18px;
      border: 4px solid var(--team-color);
      background: var(--surface);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }

    #teamA { --team-color: #1680ff; }
    #teamB { --team-color: #ff4058; }

    .team.won {
      border: 4px solid #ffd66b;
      box-shadow: 0 0 18px #ffd66b44;
      animation: winnerPulse 1.4s ease-in-out infinite alternate;
    }

    .team.match-point {
      animation: matchPointPulse .8s ease-in-out infinite alternate;
    }

    .team.won.match-point {
      animation: winnerPulse 1.4s ease-in-out infinite alternate;
    }

    @keyframes matchPointPulse {
      from { box-shadow: 0 0 5px color-mix(in srgb, var(--team-color) 25%, transparent); }
      to { box-shadow: 0 0 23px color-mix(in srgb, var(--team-color) 85%, transparent); }
    }

    .player-selects {
      width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin-bottom: 12px;
      touch-action: manipulation;
    }

    .team-name {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 7px 1px;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      text-align: center;
      text-align-last: center;
      font-size: clamp(12px, 3.3vw, 17px);
      font-weight: 750;
      text-transform: none;
      touch-action: manipulation;
    }

    .team-name:focus { border-bottom-color: var(--accent); }

    .team-name option {
      background: var(--surface);
      color: var(--text);
    }

    .ampersand {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .pair-name {
      display: none;
    }

    .match-label {
      display: none;
      color: #ffd66b;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .team.match-point .match-label {
      display: block;
    }

    .score {
      color: var(--text);
      font-size: clamp(74px, 22vw, 150px);
      line-height: 1;
      font-weight: 950;
      letter-spacing: -4px;
      font-variant-numeric: tabular-nums;
    }

    #winner {
      display: none;
      margin: 14px 10px 4px;
      padding: 12px 8px;
      color: #ffd66b;
      font-size: clamp(20px, 5.5vw, 30px);
      font-weight: 950;
      letter-spacing: .5px;
    }

    #winner.show {
      display: block;
      animation: winnerIn .5s ease both,
                 winnerGlow 1.8s ease-in-out .5s infinite alternate;
    }

    @keyframes winnerIn {
      0% { opacity: 0; transform: scale(.65) translateY(10px); }
      65% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes winnerGlow {
      from { text-shadow: 0 0 5px #ffc94a55; }
      to { text-shadow: 0 0 24px #ffc94acc; }
    }

    @keyframes winnerPulse {
      from { box-shadow: 0 0 8px #ffd66b33; }
      to { box-shadow: 0 0 26px #ffd66b77; }
    }

    .clock {
      margin: 17px 0 10px;
      font-size: clamp(38px, 10vw, 52px);
      line-height: 1.1;
      font-weight: 850;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    .controls, .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 12px;
    }

    button {
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--button);
      color: var(--text);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.97); }

    #start {
      min-width: 112px;
      background: #087d49;
      color: white;
      border-color: #0b9d60;
    }

    #resetMatch {
      background: #a92c38;
      color: white;
      border-color: #d13e4d;
    }

    #themeToggle {
      width: 42px;
      height: 40px;
      padding: 4px;
      color: var(--accent);
      font-size: 23px;
    }

    .footer {
      padding: 12px 10px 22px;
      color: var(--muted);
      font-size: 11px;
    }

    .name-manager {
      margin: 16px 10px 0;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      text-align: left;
    }

    .name-manager h2 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .manager-help {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .add-name-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .add-name-row input {
      min-width: 0;
      flex: 1;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface2);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .name-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .name-item {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 7px;
      border-radius: 9px;
      background: var(--surface2);
    }

    .name-item .name-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      padding-left: 3px;
      font-size: 13px;
      font-weight: 650;
    }

    .name-item button {
      padding: 7px 9px;
      font-size: 11px;
    }

    .name-item .delete-name {
      color: #ff7181;
    }

    .edit-name-input {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
    }

    @media (max-height: 650px) {
      header { padding-top: 9px; padding-bottom: 7px; }
      .settings { padding-bottom: 8px; }
      .teams { height: 42vh; min-height: 210px; }
      .clock { margin-top: 10px; }
      .player-selects { margin-bottom: 8px; }
      .team-name { padding: 5px 1px; }
      .footer { padding-bottom: 10px; }
    }

    @media (max-width: 360px) {
      .teams { gap: 7px; padding-left: 7px; padding-right: 7px; }
      .team { padding-left: 5px; padding-right: 5px; }
      .team-name { font-size: 12px; }
      .score { font-size: clamp(65px, 20vw, 110px); }
      .name-manager { margin-left: 7px; margin-right: 7px; padding: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>SCOREBOARD</header>

  <div class="settings">
    <label class="label" for="target">Target</label>
    <input id="target" type="number" min="1" max="999" value="21" inputmode="numeric">
    <button id="themeToggle" type="button" aria-label="Toggle theme">☀</button>
  </div>

  <main>
    <div class="teams">
      <section id="teamA" class="team" aria-label="Left court">
        <div class="player-selects">
          <select id="nameA1" class="team-name" aria-label="Team A first player"></select>
          <span class="ampersand">&amp;</span>
          <select id="nameA2" class="team-name" aria-label="Team A second player"></select>
        </div>
        <div id="scoreA" class="score">0</div>
        <div class="match-label">MATCH POINT!</div>
      </section>

      <section id="teamB" class="team" aria-label="Right court">
        <div class="player-selects">
          <select id="nameB1" class="team-name" aria-label="Team B first player"></select>
          <span class="ampersand">&amp;</span>
          <select id="nameB2" class="team-name" aria-label="Team B second player"></select>
        </div>
        <div id="scoreB" class="score">0</div>
        <div class="match-label">MATCH POINT!</div>
      </section>
    </div>

    <div id="winner" role="status" aria-live="polite"></div>

    <div id="time" class="clock" aria-label="Elapsed match time">00:00</div>

    <div class="controls">
      <button id="start" type="button">▶ Start</button>
      <button id="resetClock" type="button">↺ Reset Clock</button>
    </div>

    <div class="actions">
      <button id="swap" type="button">⇄ Swap Court</button>
      <button id="resetMatch" type="button">↻ Reset Match</button>
    </div>

    <section class="name-manager">
      <h2>Team Name List</h2>
      <p class="manager-help">
        Add, edit, or delete player names here. Choose two different names for each team above.
      </p>

      <form id="addNameForm" class="add-name-row">
        <input id="newName" type="text" maxlength="30" placeholder="Enter player name" autocomplete="off" required>
        <button type="submit">Add</button>
      </form>

      <div id="nameList" class="name-list"></div>
    </section>
  </main>

  <div class="footer">
    Tap a team panel to add a point. Swipe up to add or down to subtract.
  </div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);

      const STORAGE = {
        names: 'scoreboardTeamNames_v2',
        a1: 'scoreboardSelectedA1_v1',
        a2: 'scoreboardSelectedA2_v1',
        b1: 'scoreboardSelectedB1_v1',
        b2: 'scoreboardSelectedB2_v1',
        target: 'scoreboardTarget_v2',
        theme: 'scoreboardTheme_v2'
      };

      const DEFAULT_NAMES = [
        'Ching', 'Via', 'Gadi', 'Ee', 'Jessica',
        'Igat', 'Lulong', 'Dayang', 'Naz'
      ];

      function read(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch (_) {
          return fallback;
        }
      }

      function readJSON(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : JSON.parse(value);
        } catch (_) {
          return fallback;
        }
      }

      function save(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_) {}
      }

      let names = readJSON(STORAGE.names, null);

      if (!Array.isArray(names)) {
        // Migrate the previous version's team-name list, if one exists.
        const oldNames = readJSON('scoreboardTeamNames_v1', null);
        names = Array.isArray(oldNames) && oldNames.length
          ? oldNames
          : [...DEFAULT_NAMES];
      }

      names = [...new Set(
        names.filter(name => typeof name === 'string')
          .map(name => name.trim())
          .filter(Boolean)
      )];

      if (!names.length) names = [...DEFAULT_NAMES];

      let a = 0;
      let b = 0;
      let elapsedMs = 0;
      let running = false;
      let runStartedAt = 0;
      let winner = null;
      let timerInterval = null;
      let audioContext = null;
      let editingName = null;

      let selected = {
        a1: read(STORAGE.a1, 'Ching'),
        a2: read(STORAGE.a2, 'Via'),
        b1: read(STORAGE.b1, 'Gadi'),
        b2: read(STORAGE.b2, 'Ee')
      };

      let target = Math.max(
        1,
        Math.min(999, parseInt(read(STORAGE.target, '21'), 10) || 21)
      );

      let theme = read(STORAGE.theme, 'dark');

      $('target').value = target;

      function uniqueName(preferred, excluded = []) {
        if (names.includes(preferred) && !excluded.includes(preferred)) {
          return preferred;
        }
        return names.find(name => !excluded.includes(name)) || names[0] || '';
      }

      function normalizeSelections() {
        if (!names.length) names = [...DEFAULT_NAMES];

        selected.a1 = uniqueName(selected.a1);
        selected.a2 = uniqueName(selected.a2, [selected.a1]);
        selected.b1 = uniqueName(selected.b1, [selected.a1, selected.a2]);
        selected.b2 = uniqueName(selected.b2, [
          selected.a1, selected.a2, selected.b1
        ]);
      }

      function saveSelections() {
        Object.keys(selected).forEach(key => save(STORAGE[key], selected[key]));
      }

      function pairName(side) {
        return side === 'a'
          ? `${selected.a1} & ${selected.a2}`
          : `${selected.b1} & ${selected.b2}`;
      }

      function populateSelect(id, key) {
        const select = $(id);
        const otherNames = Object.entries(selected)
          .filter(([otherKey]) => otherKey !== key)
          .map(([, name]) => name);

        select.innerHTML = '';

        names.forEach(name => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          option.disabled = otherNames.includes(name) && name !== selected[key];
          select.appendChild(option);
        });

        select.value = selected[key];
      }

      function populateAllSelects() {
        normalizeSelections();

        populateSelect('nameA1', 'a1');
        populateSelect('nameA2', 'a2');
        populateSelect('nameB1', 'b1');
        populateSelect('nameB2', 'b2');

        saveSelections();
      }

      function onSelectionChange(key, id) {
        const newName = $(id).value;

        const alreadyUsed = Object.entries(selected)
          .some(([otherKey, value]) => otherKey !== key && value === newName);

        if (alreadyUsed) {
          populateAllSelects();
          return;
        }

        selected[key] = newName;
        populateAllSelects();
        draw();
      }

      ['a1', 'a2', 'b1', 'b2'].forEach(key => {
        const ids = {
          a1: 'nameA1',
          a2: 'nameA2',
          b1: 'nameB1',
          b2: 'nameB2'
        };
        $(ids[key]).addEventListener('change', () => onSelectionChange(key, ids[key]));
      });

      function getElapsedMs() {
        return running ? elapsedMs + Math.max(0, Date.now() - runStartedAt) : elapsedMs;
      }

      function formatTime(milliseconds) {
        const totalSeconds = Math.floor(milliseconds / 1000);
        return String(Math.floor(totalSeconds / 60)).padStart(2, '0') + ':' +
          String(totalSeconds % 60).padStart(2, '0');
      }

      function pauseClock() {
        if (running) elapsedMs = getElapsedMs();
        running = false;
      }

      function playMatchPointSound() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;

          if (!audioContext) audioContext = new AudioContextClass();

          const play = () => {
            const now = audioContext.currentTime;

            [880, 1175].forEach((frequency, index) => {
              const oscillator = audioContext.createOscillator();
              const gain = audioContext.createGain();
              const startAt = now + index * 0.16;

              oscillator.type = 'sine';
              oscillator.frequency.value = frequency;

              gain.gain.setValueAtTime(0.0001, startAt);
              gain.gain.exponentialRampToValueAtTime(0.14, startAt + 0.025);
              gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.13);

              oscillator.connect(gain);
              gain.connect(audioContext.destination);
              oscillator.start(startAt);
              oscillator.stop(startAt + 0.14);
            });
          };

          if (audioContext.state === 'suspended') {
            audioContext.resume().then(play).catch(() => {});
          } else {
            play();
          }
        } catch (_) {}
      }

      function checkWinner() {
        if (winner) return;

        if (a >= target) winner = 'a';
        else if (b >= target) winner = 'b';

        if (winner) pauseClock();
      }

      function draw() {
        $('scoreA').textContent = a;
        $('scoreB').textContent = b;
        $('time').textContent = formatTime(getElapsedMs());
        $('start').textContent = running ? 'Ⅱ Pause' : '▶ Start';
        $('target').value = target;

        $('teamA').classList.toggle('won', winner === 'a');
        $('teamB').classList.toggle('won', winner === 'b');

        $('teamA').classList.toggle('match-point', !winner && a === target - 1);
        $('teamB').classList.toggle('match-point', !winner && b === target - 1);

        const banner = $('winner');

        if (winner) {
          const message = '🏆 ' + pairName(winner) + ' WINS!';
          if (banner.textContent !== message) {
            banner.textContent = message;
            banner.classList.remove('show');
            void banner.offsetWidth;
            banner.classList.add('show');
          } else {
            banner.classList.add('show');
          }
        } else {
          banner.textContent = '';
          banner.classList.remove('show');
        }
      }

      function change(side, delta) {
        if (winner) return;

        const wasMatchA = a === target - 1;
        const wasMatchB = b === target - 1;

        if (side === 'a') a = Math.max(0, a + delta);
        else b = Math.max(0, b + delta);

        checkWinner();

        if (!winner) {
          const isMatchA = a === target - 1;
          const isMatchB = b === target - 1;

          if ((!wasMatchA && isMatchA) || (!wasMatchB && isMatchB)) {
            playMatchPointSound();
          }
        }

        draw();
      }

      function setupSwipe(id, side) {
        const el = $(id);
        let start = null;

        el.addEventListener('pointerdown', event => {
          if (event.target.closest('select, input, button')) {
            start = null;
            return;
          }

          if (event.pointerType === 'mouse' && event.button !== 0) {
            start = null;
            return;
          }

          start = {
            x: event.clientX,
            y: event.clientY,
            time: Date.now()
          };
        });

        el.addEventListener('pointerup', event => {
          if (!start) return;

          const dx = event.clientX - start.x;
          const dy = event.clientY - start.y;
          const duration = Date.now() - start.time;
          start = null;

          if (event.target.closest('select, input, button')) return;

          if (Math.abs(dy) > 25 && Math.abs(dy) > Math.abs(dx)) {
            change(side, dy < 0 ? 1 : -1);
          } else if (
            Math.abs(dx) < 12 &&
            Math.abs(dy) < 12 &&
            duration < 500
          ) {
            change(side, 1);
          }
        });

        el.addEventListener('pointercancel', () => {
          start = null;
        });
      }

      setupSwipe('teamA', 'a');
      setupSwipe('teamB', 'b');

      $('start').addEventListener('click', () => {
        if (winner) return;

        if (running) {
          pauseClock();
        } else {
          runStartedAt = Date.now();
          running = true;
        }

        draw();
      });

      timerInterval = setInterval(draw, 100);

      $('resetClock').addEventListener('click', () => {
        running = false;
        elapsedMs = 0;
        runStartedAt = 0;
        draw();
      });

      $('swap').addEventListener('click', () => {
        const oldA = { ...selected };
        const oldColorA = getComputedStyle($('teamA')).getPropertyValue('--team-color').trim();
        const oldColorB = getComputedStyle($('teamB')).getPropertyValue('--team-color').trim();

        selected.a1 = oldA.b1;
        selected.a2 = oldA.b2;
        selected.b1 = oldA.a1;
        selected.b2 = oldA.a2;

        [a, b] = [b, a];

        $('teamA').style.setProperty('--team-color', oldColorB);
        $('teamB').style.setProperty('--team-color', oldColorA);

        if (winner) winner = winner === 'a' ? 'b' : 'a';

        populateAllSelects();
        draw();
      });

      $('resetMatch').addEventListener('click', () => {
        if (!confirm('Reset both scores and the match clock?')) return;

        a = 0;
        b = 0;
        elapsedMs = 0;
        running = false;
        runStartedAt = 0;
        winner = null;
        draw();
      });

      $('target').addEventListener('change', () => {
        const value = Number($('target').value);
        target = Number.isFinite(value) && value >= 1
          ? Math.min(999, Math.floor(value))
          : 21;

        save(STORAGE.target, String(target));
        winner = null;
        checkWinner();
        draw();
      });

      function applyTheme() {
        document.body.classList.toggle('light', theme === 'light');
        $('themeToggle').textContent = theme === 'dark' ? '☀' : '☾';
        $('themeToggle').setAttribute(
          'aria-label',
          theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        );

        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f1f4f9' : '#090b10';

        save(STORAGE.theme, theme);
      }

      $('themeToggle').addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        applyTheme();
      });

      function renderNameList() {
        const list = $('nameList');
        list.innerHTML = '';

        names.forEach(name => {
          const row = document.createElement('div');
          row.className = 'name-item';

          if (editingName === name) {
            const input = document.createElement('input');
            input.className = 'edit-name-input';
            input.value = name;
            input.maxLength = 30;
            input.setAttribute('aria-label', 'Edit player name');

            const saveButton = document.createElement('button');
            saveButton.type = 'button';
            saveButton.textContent = 'Save';
            saveButton.addEventListener('click', () => {
              const updated = input.value.trim();

              if (!updated) {
                alert('Enter a player name.');
                return;
              }

              if (names.some(n => n.toLowerCase() === updated.toLowerCase() && n !== name)) {
                alert('That name already exists.');
                return;
              }

              names[names.indexOf(name)] = updated;

              Object.keys(selected).forEach(key => {
                if (selected[key] === name) selected[key] = updated;
              });

              editingName = null;
              save(STORAGE.names, JSON.stringify(names));
              populateAllSelects();
              renderNameList();
              draw();
            });

            const cancelButton = document.createElement('button');
            cancelButton.type = 'button';
            cancelButton.textContent = 'Cancel';
            cancelButton.addEventListener('click', () => {
              editingName = null;
              renderNameList();
            });

            row.append(input, saveButton, cancelButton);
            list.appendChild(row);
            input.focus();
            return;
          }

          const label = document.createElement('span');
          label.className = 'name-text';
          label.textContent = name;

          const editButton = document.createElement('button');
          editButton.type = 'button';
          editButton.textContent = 'Edit';
          editButton.addEventListener('click', () => {
            editingName = name;
            renderNameList();
          });

          const deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.textContent = 'Delete';
          deleteButton.className = 'delete-name';

          deleteButton.addEventListener('click', () => {
            if (names.length <= 4) {
              alert('Keep at least four names so both teams can have two different players.');
              return;
            }

            if (!confirm(`Delete "${name}" from the player list?`)) return;

            names = names.filter(n => n !== name);

            Object.keys(selected).forEach(key => {
              if (selected[key] === name) selected[key] = '';
            });

            normalizeSelections();
            editingName = null;
            save(STORAGE.names, JSON.stringify(names));
            populateAllSelects();
            renderNameList();
            draw();
          });

          row.append(label, editButton, deleteButton);
          list.appendChild(row);
        });
      }

      $('addNameForm').addEventListener('submit', event => {
        event.preventDefault();

        const input = $('newName');
        const name = input.value.trim();

        if (!name) return;

        if (names.some(n => n.toLowerCase() === name.toLowerCase())) {
          alert('That name already exists.');
          return;
        }

        names.push(name);
        save(STORAGE.names, JSON.stringify(names));
        populateAllSelects();
        renderNameList();
        input.value = '';
      });

      normalizeSelections();
      save(STORAGE.names, JSON.stringify(names));
      applyTheme();
      populateAllSelects();
      renderNameList();
      draw();
    })();
  </script>
</body>
</html>
