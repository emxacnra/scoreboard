<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030611">
  <title>Neon Scoreboard v1.29</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #030611;
      --surface: #080d20;
      --surface2: #0c1530;
      --text: #f3fbff;
      --muted: #9aa8d6;
      --border: #24345f;
      --accent: #00eaff;
      --button: #101637;
      --blue: #00d9ff;
      --red: #ff174f;
      --purple: #c34cff;
      --gold: #ffd54a;
    }

    body.light {
      color-scheme: light;
      --bg: #edf2ff;
      --surface: #ffffff;
      --surface2: #e1eaff;
      --text: #111a35;
      --muted: #647397;
      --border: #c5d2ef;
      --accent: #087fc0;
      --button: #e2e9ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 20%, #003b8b35, transparent 42%),
        radial-gradient(ellipse at 85% 24%, #85002c30, transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
      transition: background .25s, color .25s;
    }

    body.light {
      background:
        radial-gradient(ellipse at 10% 15%, #00c8ff14, transparent 40%),
        radial-gradient(ellipse at 90% 20%, #ff176b10, transparent 40%),
        var(--bg);
    }

    /* Title: plain text flanked by lines fading out from each team colour */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 14px 12px;
      font-size: clamp(20px, 5.5vw, 28px);
      font-weight: 950;
      letter-spacing: 5px;
      color: var(--text);
      text-shadow: none;
    }

    header::before,
    header::after {
      content: "";
      flex: 1;
      height: 3px;
      border-radius: 3px;
    }

    header::before {
      background: linear-gradient(90deg, transparent, var(--blue));
    }

    header::after {
      background: linear-gradient(90deg, var(--red), transparent);
    }

    body.light header::before {
      background: linear-gradient(90deg, transparent, #087fc0);
    }

    body.light header::after {
      background: linear-gradient(90deg, #d4003c, transparent);
    }

    .settings {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
      padding: 4px 12px 14px;
    }

    .label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    input, button, select { font: inherit; }

    #target {
      width: 70px;
      padding: 8px;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 0 10px #00eaff30;
      text-align: center;
      font-size: 16px;
    }

    .teams {
      display: flex;
      gap: 10px;
      padding: 0 10px;
      height: clamp(280px, 49vh, 480px);
    }

    .team {
      --team-color: var(--blue);
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 12px 7px;
      border-radius: 18px;
      border: 8px solid var(--team-color);
      background: linear-gradient(145deg, #0b1430, #030611 75%);
      box-shadow:
        0 0 8px var(--team-color),
        0 0 22px color-mix(in srgb, var(--team-color) 55%, transparent),
        inset 0 0 18px color-mix(in srgb, var(--team-color) 15%, transparent);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }

    #teamA { --team-color: var(--blue); }
    #teamB { --team-color: var(--red); }

    body.light .team {
      background: linear-gradient(145deg, #fff, #edf3ff);
      box-shadow:
        0 0 7px color-mix(in srgb, var(--team-color) 50%, transparent),
        inset 0 0 14px color-mix(in srgb, var(--team-color) 8%, transparent);
    }

    .player-selects {
      position: relative;
      width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 8px;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .player-selects::after {
      content: "|";
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      color: var(--team-color);
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 8px var(--team-color);
      pointer-events: none;
    }

    .team-name {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      width: 50%;
      min-width: 0;
      padding: 7px 15px 7px 3px;
      border: 1px solid color-mix(in srgb, var(--team-color) 65%, transparent);
      border-radius: 9px;
      outline: none;
      background: #05091a;
      color: #f3fbff;
      text-align: center;
      text-align-last: center;
      font-size: clamp(11px, 3.2vw, 16px);
      font-weight: 750;
      box-shadow: 0 0 10px color-mix(in srgb, var(--team-color) 25%, transparent);
      touch-action: manipulation;
    }

    body.light .team-name {
      background: #fff;
      color: #111a35;
    }

    .team-name:focus {
      border-color: var(--team-color);
      box-shadow: 0 0 14px var(--team-color);
    }

    .team-name option {
      background: #080d20;
      color: #f3fbff;
    }

    /* Score numbers: plain color, no neon text glow */
    .score {
      color: #f3fbff;
      font-size: clamp(96px, 27vw, 180px);
      line-height: 1;
      font-weight: 950;
      letter-spacing: -5px;
      font-variant-numeric: tabular-nums;
      margin: auto 0;
      text-shadow: none;
    }

    body.light .score {
      color: #111a35;
      text-shadow: none;
    }

    .match-label {
      display: none;
      color: var(--gold);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 2px;
      margin-top: 8px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px #ffbf00;
    }

    .team.match-point {
      animation: matchPointPulse .8s ease-in-out infinite alternate;
    }

    .team.match-point .match-label { display: block; }

    /* In-panel winner label (replaces the old banner) */
    .win-label {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 8px 0;
      color: var(--gold);
      font-size: 15px;
      font-weight: 950;
      letter-spacing: 2px;
      animation: winnerIn .55s cubic-bezier(.2, .8, .2, 1) both;
    }

    .team.won .win-label { display: flex; }

    .team.won .score { color: var(--gold); }

    body.light .team.won .score { color: #b8860b; }

    body.light .win-label { color: #b8860b; }

    /* Losing panel fades back so the winner stands out */
    .team.lost {
      opacity: .45;
      filter: saturate(.5);
    }

    .team.won {
      border: 8px solid var(--gold);
      box-shadow:
        0 0 12px var(--gold),
        0 0 30px #ffb30088,
        inset 0 0 20px #ffd54a22;
      animation: winnerPulse 1.4s ease-in-out infinite alternate;
    }

    @keyframes matchPointPulse {
      from {
        box-shadow: 0 0 8px color-mix(in srgb, var(--team-color) 35%, transparent);
      }
      to {
        box-shadow:
          0 0 15px var(--team-color),
          0 0 35px color-mix(in srgb, var(--team-color) 70%, transparent),
          inset 0 0 25px color-mix(in srgb, var(--team-color) 20%, transparent);
      }
    }

    @keyframes winnerPulse {
      from {
        box-shadow: 0 0 8px #ffd54a66, inset 0 0 10px #ffd54a11;
      }
      to {
        box-shadow: 0 0 28px #ffd54acc, inset 0 0 24px #ffd54a33;
      }
    }

    @keyframes winnerIn {
      0% {
        opacity: 0;
        transform: scale(.72) translateY(14px);
      }
      65% {
        opacity: 1;
        transform: scale(1.04) translateY(0);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Timer: no neon text glow */
    .clock {
      display: inline-block;
      min-width: 60%;
      margin: 17px 0 10px;
      padding: 8px 18px;
      border: 1px solid #087dff;
      border-radius: 14px;
      background: #05091a;
      color: #00eaff;
      font-size: clamp(38px, 10vw, 52px);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
      text-shadow: none;
      box-shadow: none;
    }

    body.light .clock {
      background: #fff;
      color: #087fc0;
      text-shadow: none;
      box-shadow: none;
    }

    .controls, .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 12px;
    }

    button {
      padding: 11px 14px;
      border: 1px solid var(--purple);
      border-radius: 10px;
      background: linear-gradient(135deg, #111a3d, #080d20);
      color: var(--text);
      box-shadow: 0 0 10px #623dff55;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow .2s, border-color .2s, background .2s, color .2s;
    }

    button:active {
      transform: scale(.97);
      box-shadow: 0 0 18px #a855f7aa;
    }

    #start {
      min-width: 112px;
      background: #032719;
      color: #fff;
      border-color: #00ff9d;
      box-shadow: 0 0 14px #00ff9d66;
    }

    #resetClock {
      border-color: #7565ff;
      box-shadow: 0 0 12px #7565ff55;
    }

    #swap {
      border-color: #c34cff;
      box-shadow: 0 0 12px #c34cff55;
    }

    body.light #start,
    body.light #resetClock,
    body.light #swap,
    body.light #addPlayer {
      background: #fff;
      color: #17213d;
      text-shadow: none;
      font-weight: 850;
    }

    body.light #start {
      border-color: #008c60;
      box-shadow: 0 0 8px #008c6022;
    }

    body.light #resetClock {
      border-color: #6550db;
      box-shadow: 0 0 8px #6550db22;
    }

    body.light #swap,
    body.light #addPlayer {
      border-color: #a12bc5;
      box-shadow: 0 0 8px #a12bc522;
    }

    body.light #start:hover,
    body.light #resetClock:hover,
    body.light #swap:hover,
    body.light #addPlayer:hover {
      background: #eeeaff;
    }

    #resetMatch { display: none !important; }

    /* Theme toggle: white sun in dark mode, black moon in light mode */
    #themeToggle {
      width: 42px;
      height: 40px;
      padding: 4px;
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 10px #00eaff55;
      font-size: 23px;
      background: var(--button);
    }

    body:not(.light) #themeToggle {
      color: #ffffff;
      font-family: Arial, "Segoe UI Symbol", sans-serif;
    }

    body.light #themeToggle {
      background: var(--bg);
      color: #000000;
      border-color: #087fc0;
      box-shadow: 0 0 8px #087fc022;
    }

    body.light #themeToggle:hover {
      background: #e1eaff;
    }

    #voiceToggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 44px;
      padding: 4px;
      border-color: var(--accent);
      box-shadow: 0 0 10px #00eaff55;
    }

    #voiceToggle.on {
      border-color: #00ff9d;
      box-shadow: 0 0 12px #00ff9d66;
    }

    body.light #voiceToggle {
      background: #fff;
      color: #17213d;
      border-color: #087fc0;
      box-shadow: 0 0 8px #087fc022;
    }

    body.light #voiceToggle.on {
      border-color: #008c60;
      box-shadow: 0 0 8px #008c6022;
    }

    #addPlayer {
      background: linear-gradient(135deg, #220b3d, #080d20);
      border-color: #e040fb;
      color: #f0a6ff;
      box-shadow: 0 0 12px #e040fb55;
    }

    .footer {
      padding: 12px 10px 22px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.9;
      letter-spacing: 1px;
    }

    @media (max-height: 650px) {
      header { padding-top: 9px; padding-bottom: 7px; }
      .settings { padding-bottom: 8px; }
      .teams { height: 42vh; min-height: 210px; }
      .clock { margin-top: 10px; }
      .player-selects { margin-bottom: 5px; }
      .team-name { padding: 5px 12px 5px 3px; }
      .score { font-size: clamp(76px, 22vw, 140px); }
      .footer { padding-bottom: 10px; }
    }

    @media (max-width: 360px) {
      .teams {
        gap: 7px;
        padding-left: 7px;
        padding-right: 7px;
      }

      .team { padding-left: 5px; padding-right: 5px; }
      .team-name { font-size: 11px; }
      .score { font-size: clamp(72px, 21vw, 120px); }
      button { padding: 10px 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>SCOREBOARD</header>

  <div class="settings">
    <label class="label" for="target">Target</label>
    <input id="target" type="number" min="1" max="999" value="21" inputmode="numeric">
    <button id="voiceToggle" type="button" aria-label="Voice off"></button>
    <button id="themeToggle" type="button" aria-label="Toggle theme">☀</button>
  </div>

  <main>
    <div class="teams">
      <section id="teamA" class="team" aria-label="Blue court">
        <div class="player-selects">
          <select id="nameA1" class="team-name" aria-label="Blue team player 1"></select>
          <select id="nameA2" class="team-name" aria-label="Blue team player 2"></select>
        </div>
        <div id="scoreA" class="score">0</div>
        <div class="match-label">MATCH POINT!</div>
        <div class="win-label" role="status"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4"/><path d="M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4"/><path d="M10 17h4"/><path d="M8 20h8"/></svg><span>WINNER!</span></div>
      </section>

      <section id="teamB" class="team" aria-label="Red court">
        <div class="player-selects">
          <select id="nameB1" class="team-name" aria-label="Red team player 1"></select>
          <select id="nameB2" class="team-name" aria-label="Red team player 2"></select>
        </div>
        <div id="scoreB" class="score">0</div>
        <div class="match-label">MATCH POINT!</div>
        <div class="win-label" role="status"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4"/><path d="M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4"/><path d="M10 17h4"/><path d="M8 20h8"/></svg><span>WINNER!</span></div>
      </section>
    </div>

    <div id="time" class="clock" aria-label="Elapsed match time">00:00</div>

    <div class="controls">
      <button id="start" type="button">▶ Start</button>
      <button id="resetClock" type="button">↺ Reset Clock</button>
    </div>

    <div class="actions">
      <button id="swap" type="button">⇄ Swap Court</button>
      <button id="resetMatch" type="button">↻ Reset Match</button>
      <button id="addPlayer" type="button">＋ Add Player</button>
    </div>
  </main>

  <div class="footer">
    TAP TO ADD A POINT · SWIPE UP TO ADD · SWIPE DOWN TO SUBTRACT<br>
    HOLD EITHER TEAM BOX TO RESET THE MATCH
  </div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);

      const STORAGE = {
        names: 'scoreboardTeamNameList_v3',
        a1: 'scoreboardSelectedA1_v1',
        a2: 'scoreboardSelectedA2_v1',
        b1: 'scoreboardSelectedB1_v1',
        b2: 'scoreboardSelectedB2_v1',
        target: 'scoreboardTarget_v2',
        theme: 'scoreboardTheme_v2',
        voice: 'scoreboardVoice_v1'
      };

      const DEFAULT_NAMES = [
        'A', 'B', 'Team',
        'Ching', 'Ee', 'Gadi', 'Igat',
        'Jessica', 'Lulong', 'Via', 'Dayang'
      ];

      const SPECIAL_NAMES = new Set(['Team', 'A', 'B']);
      const HOLD_DURATION = 700;
      const HOLD_MOVE_LIMIT = 15;

      function read(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch (_) {
          return fallback;
        }
      }

      function readJSON(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : JSON.parse(value);
        } catch (_) {
          return fallback;
        }
      }

      function save(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_) {}
      }

      let names = readJSON(STORAGE.names, null);

      if (!Array.isArray(names)) {
        const v2 = readJSON('scoreboardTeamNames_v2', null);
        const v1 = readJSON('scoreboardTeamNames_v1', null);

        names = Array.isArray(v2) ? v2 :
                Array.isArray(v1) ? v1 : [...DEFAULT_NAMES];
      }

      names = [...new Set(
        names
          .filter(name => typeof name === 'string')
          .map(name => name.trim())
          .filter(name => name && name.toLowerCase() !== 'naz')
      )];

      if (names.length < 4) names = [...DEFAULT_NAMES];

      ['A', 'B', 'Team'].forEach(name => {
        if (!names.some(n => n.toLowerCase() === name.toLowerCase())) {
          names.push(name);
        }
      });

      names.sort((x, y) =>
        x.localeCompare(y, undefined, { sensitivity: 'base' })
      );

      let a = 0;
      let b = 0;
      let elapsedMs = 0;
      let running = false;
      let runStartedAt = 0;
      let winner = null;
      // Tracks whether "20" has already been announced for each panel
      let said20 = { a: false, b: false };
      let audioContext = null;

      let selected = {
        a1: read(STORAGE.a1, 'Team'),
        a2: read(STORAGE.a2, 'A'),
        b1: read(STORAGE.b1, 'Team'),
        b2: read(STORAGE.b2, 'B')
      };

      let target = Math.max(
        1,
        Math.min(999, parseInt(read(STORAGE.target, '21'), 10) || 21)
      );

      // Theme always starts in dark mode on page load
      let theme = 'dark';
      // Voice always starts off on page load
      let voiceOn = false;
      $('target').value = target;

      function isPlayer1(key) {
        return key.endsWith('1');
      }

      function isAllowedInSlot(name, key) {
        if (name === 'Team') return isPlayer1(key);
        if (name === 'A' || name === 'B') return !isPlayer1(key);
        return true;
      }

      function uniqueName(preferred, excluded = [], key = 'a1') {
        if (
          names.includes(preferred) &&
          isAllowedInSlot(preferred, key) &&
          (preferred === 'Team' || !excluded.includes(preferred))
        ) {
          return preferred;
        }

        return names.find(name =>
          !SPECIAL_NAMES.has(name) &&
          isAllowedInSlot(name, key) &&
          !excluded.includes(name)
        ) || '';
      }

      function normalizeSelections() {
        const next = {};

        ['a1', 'a2', 'b1', 'b2'].forEach(key => {
          next[key] = uniqueName(
            selected[key],
            Object.values(next),
            key
          );
        });

        selected = next;
      }

      function saveSelections() {
        Object.keys(selected).forEach(key => {
          save(STORAGE[key], selected[key]);
        });
      }

      function pairName(side) {
        const p1 = side === 'a' ? selected.a1 : selected.b1;
        const p2 = side === 'a' ? selected.a2 : selected.b2;

        if (p1 === 'Team' && (p2 === 'A' || p2 === 'B')) {
          return `${p1} ${p2}`;
        }

        return `${p1} & ${p2}`;
      }

      function populateSelect(id, key) {
        const select = $(id);
        const current = selected[key];

        const used = Object.entries(selected)
          .filter(([otherKey]) => otherKey !== key)
          .map(([, name]) => name);

        select.innerHTML = '';

        names.forEach(name => {
          if (SPECIAL_NAMES.has(name)) return;

          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          option.disabled = used.includes(name);
          select.appendChild(option);
        });

        if (SPECIAL_NAMES.has(current)) {
          const option = document.createElement('option');
          option.value = current;
          option.textContent = current;
          option.hidden = true;
          option.selected = true;
          select.insertBefore(option, select.firstChild);
        }

        select.value = current;
      }

      function populateAllSelects() {
        normalizeSelections();
        populateSelect('nameA1', 'a1');
        populateSelect('nameA2', 'a2');
        populateSelect('nameB1', 'b1');
        populateSelect('nameB2', 'b2');
        saveSelections();
      }

      function onSelectionChange(key, id) {
        const value = $(id).value;

        const used = Object.entries(selected).some(
          ([otherKey, name]) =>
            otherKey !== key &&
            name === value &&
            value !== 'Team'
        );

        if (!isAllowedInSlot(value, key) || used) {
          populateAllSelects();
          return;
        }

        selected[key] = value;
        populateAllSelects();
        draw();
      }

      [
        ['nameA1', 'a1'],
        ['nameA2', 'a2'],
        ['nameB1', 'b1'],
        ['nameB2', 'b2']
      ].forEach(([id, key]) => {
        $(id).addEventListener('change', () => onSelectionChange(key, id));
      });

      function getElapsedMs() {
        return running
          ? elapsedMs + Math.max(0, Date.now() - runStartedAt)
          : elapsedMs;
      }

      function formatTime(milliseconds) {
        const total = Math.floor(milliseconds / 1000);
        return String(Math.floor(total / 60)).padStart(2, '0') + ':' +
          String(total % 60).padStart(2, '0');
      }

      function pauseClock() {
        if (running) elapsedMs = getElapsedMs();
        running = false;
      }

      function playScoreSound(delta) {
        // Voice mode replaces the beeps
        if (voiceOn && 'speechSynthesis' in window) return;

        try {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) return;
          if (!audioContext) audioContext = new AudioContextClass();

          const play = () => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const now = audioContext.currentTime;

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(delta > 0 ? 660 : 330, now);
            oscillator.frequency.exponentialRampToValueAtTime(
              delta > 0 ? 880 : 220,
              now + 0.08
            );

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(now);
            oscillator.stop(now + 0.13);
          };

          if (audioContext.state === 'suspended') {
            audioContext.resume().then(play).catch(() => {});
          } else {
            play();
          }
        } catch (_) {}
      }

      function playMatchPointSound() {
        // Voice mode replaces the beeps
        if (voiceOn && 'speechSynthesis' in window) return;

        try {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) return;
          if (!audioContext) audioContext = new AudioContextClass();

          const play = () => {
            const now = audioContext.currentTime;

            [880, 1175].forEach((frequency, index) => {
              const oscillator = audioContext.createOscillator();
              const gain = audioContext.createGain();
              const startAt = now + index * 0.16;

              oscillator.type = 'sine';
              oscillator.frequency.value = frequency;

              gain.gain.setValueAtTime(0.0001, startAt);
              gain.gain.exponentialRampToValueAtTime(0.14, startAt + 0.025);
              gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.13);

              oscillator.connect(gain);
              gain.connect(audioContext.destination);
              oscillator.start(startAt);
              oscillator.stop(startAt + 0.14);
            });
          };

          if (audioContext.state === 'suspended') {
            audioContext.resume().then(play).catch(() => {});
          } else {
            play();
          }
        } catch (_) {}
      }

      // Speak text in British English (uses a UK voice if installed)
      function speakText(text) {
        if (!('speechSynthesis' in window)) return;

        try {
          const utterance = new SpeechSynthesisUtterance(text);
          const british = window.speechSynthesis.getVoices().find(v =>
            (v.lang || '').toLowerCase().replace('_', '-') === 'en-gb'
          );

          utterance.lang = 'en-GB';
          if (british) utterance.voice = british;
          utterance.rate = 1;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utterance);
        } catch (_) {}
      }

      // Announce score as "<scoring team> <other team>"
      function speakScore(side, matchPoint = false) {
        if (!voiceOn || !('speechSynthesis' in window)) return;

        try {
          const scoring = side === 'a' ? a : b;
          const other = side === 'a' ? b : a;
          const otherSide = side === 'a' ? 'b' : 'a';

          // 0-9 normal; 10-19 second digit only (10 -> "0", 15 -> "5");
          // 20 spoken in full the first time for each panel, then "0";
          // above 20 spoken normally
          const say = (n, key) => {
            if (n === 20) {
              if (said20[key]) return '0';
              said20[key] = true;
              return '20';
            }

            return String(n >= 10 && n <= 19 ? n % 10 : n);
          };

          speakText(`${say(scoring, side)} ${say(other, otherSide)}` + (matchPoint ? ' match point' : ''));
        } catch (_) {}
      }

      function checkWinner() {
        if (winner) return;
        if (a >= target) winner = 'a';
        else if (b >= target) winner = 'b';
        if (winner) pauseClock();
      }

      function draw() {
        $('scoreA').textContent = a;
        $('scoreB').textContent = b;
        $('time').textContent = formatTime(getElapsedMs());
        $('start').textContent = running ? 'Ⅱ Pause' : '▶ Start';
        $('target').value = target;

        $('teamA').classList.toggle('won', winner === 'a');
        $('teamB').classList.toggle('won', winner === 'b');

        $('teamA').classList.toggle(
          'match-point', !winner && a === target - 1
        );

        $('teamB').classList.toggle(
          'match-point', !winner && b === target - 1
        );

        $('teamA').classList.toggle('lost', !!winner && winner !== 'a');
        $('teamB').classList.toggle('lost', !!winner && winner !== 'b');
      }

      function change(side, delta) {
        if (winner) return;

        const currentScore = side === 'a' ? a : b;
        const nextScore = Math.max(0, currentScore + delta);

        if (nextScore === currentScore) return;

        playScoreSound(delta);

        const oldMatchA = a === target - 1;
        const oldMatchB = b === target - 1;

        if (side === 'a') a = nextScore;
        else b = nextScore;

        let matchPointHit = false;

        checkWinner();

        if (!winner) {
          const newMatchA = a === target - 1;
          const newMatchB = b === target - 1;

          if (
            (!oldMatchA && newMatchA) ||
            (!oldMatchB && newMatchB)
          ) {
            matchPointHit = true;
            playMatchPointSound();
          }
        }

        // No announcement on the winning point
        if (delta > 0 && !winner) speakScore(side, matchPointHit);

        draw();
      }

      function resetMatch() {
        if (!confirm('Reset both scores and the match clock?')) return;

        a = 0;
        b = 0;
        elapsedMs = 0;
        running = false;
        runStartedAt = 0;
        winner = null;
        said20 = { a: false, b: false };
        draw();
      }

      function setupSwipe(id, side) {
        const el = $(id);
        let start = null;

        el.addEventListener('pointerdown', event => {
          if (event.target.closest('select, input, button')) {
            start = null;
            return;
          }

          if (event.pointerType === 'mouse' && event.button !== 0) {
            start = null;
            return;
          }

          start = {
            x: event.clientX,
            y: event.clientY,
            time: Date.now()
          };
        });

        el.addEventListener('pointerup', event => {
          if (!start) return;

          const dx = event.clientX - start.x;
          const dy = event.clientY - start.y;
          const duration = Date.now() - start.time;
          start = null;

          if (event.target.closest('select, input, button')) return;

          if (
            duration >= HOLD_DURATION &&
            Math.abs(dx) < HOLD_MOVE_LIMIT &&
            Math.abs(dy) < HOLD_MOVE_LIMIT
          ) {
            resetMatch();
            return;
          }

          if (Math.abs(dy) > 25 && Math.abs(dy) > Math.abs(dx)) {
            change(side, dy < 0 ? 1 : -1);
          } else if (
            Math.abs(dx) < 12 &&
            Math.abs(dy) < 12 &&
            duration < HOLD_DURATION
          ) {
            change(side, 1);
          }
        });

        el.addEventListener('pointercancel', () => {
          start = null;
        });

        el.addEventListener('contextmenu', event => {
          event.preventDefault();
        });
      }

      setupSwipe('teamA', 'a');
      setupSwipe('teamB', 'b');

      $('start').addEventListener('click', () => {
        if (winner) return;

        if (running) {
          pauseClock();
        } else {
          runStartedAt = Date.now();
          running = true;
        }

        draw();
      });

      setInterval(draw, 100);

      $('resetClock').addEventListener('click', () => {
        running = false;
        elapsedMs = 0;
        runStartedAt = 0;
        draw();
      });

      $('swap').addEventListener('click', () => {
        const old = { ...selected };

        const colorA = getComputedStyle($('teamA'))
          .getPropertyValue('--team-color').trim();

        const colorB = getComputedStyle($('teamB'))
          .getPropertyValue('--team-color').trim();

        selected.a1 = old.b1;
        selected.a2 = old.b2;
        selected.b1 = old.a1;
        selected.b2 = old.a2;

        [a, b] = [b, a];
        said20 = { a: said20.b, b: said20.a };

        $('teamA').style.setProperty('--team-color', colorB);
        $('teamB').style.setProperty('--team-color', colorA);

        if (winner) winner = winner === 'a' ? 'b' : 'a';

        populateAllSelects();
        draw();
      });

      $('resetMatch').addEventListener('click', resetMatch);

      $('target').addEventListener('change', () => {
        const value = Number($('target').value);

        target = Number.isFinite(value) && value >= 1
          ? Math.min(999, Math.floor(value))
          : 21;

        save(STORAGE.target, String(target));
        winner = null;
        checkWinner();
        draw();
      });

      function applyTheme() {
        document.body.classList.toggle('light', theme === 'light');

        /* Sun in dark mode; moon in light mode.
           \uFE0E forces text presentation so CSS color applies (white sun). */
        $('themeToggle').textContent =
          theme === 'dark' ? '\u2600\uFE0E' : '☾';

        $('themeToggle').setAttribute(
          'aria-label',
          theme === 'dark'
            ? 'Switch to light theme'
            : 'Switch to dark theme'
        );

        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#edf2ff' : '#030611';

      }

      function applyVoice() {
        // Loudspeaker SVG icons (inherit button text colour)
        const svgStart =
          '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" ' +
          'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
          'stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M3 10l11-5v14L3 14z"/><path d="M7 14.5l1.5 5h3l-1-4"/>';
        const iconOn = svgStart + '<path d="M18 9a4 4 0 0 1 0 6"/></svg>';
        const iconOff = svgStart + '<path d="M3 3l18 18"/></svg>';

        $('voiceToggle').innerHTML = voiceOn ? iconOn : iconOff;
        $('voiceToggle').setAttribute(
          'aria-label',
          voiceOn ? 'Voice on' : 'Voice off'
        );
        $('voiceToggle').classList.toggle('on', voiceOn);
      }

      $('voiceToggle').addEventListener('click', () => {
        voiceOn = !voiceOn;
        applyVoice();

        // Speak a short confirmation (also unlocks speech on iOS)
        if (voiceOn && 'speechSynthesis' in window) {
          speakText('Voice on');
        }
      });

      $('themeToggle').addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        applyTheme();
      });

      $('addPlayer').addEventListener('click', () => {
        const entry = prompt('Enter the new player name:');
        if (entry === null) return;

        const name = entry.trim();

        if (!name) {
          alert('Enter a player name.');
          return;
        }

        if (name.toLowerCase() === 'naz') {
          alert('That name cannot be added.');
          return;
        }

        if ([...SPECIAL_NAMES].some(
          special => special.toLowerCase() === name.toLowerCase()
        )) {
          alert('A, B, and Team are reserved shortcut names.');
          return;
        }

        if (names.some(n => n.toLowerCase() === name.toLowerCase())) {
          alert('That player is already on the list.');
          return;
        }

        names.push(name);
        names.sort((x, y) =>
          x.localeCompare(y, undefined, { sensitivity: 'base' })
        );

        save(STORAGE.names, JSON.stringify(names));
        populateAllSelects();
      });

      save(STORAGE.names, JSON.stringify(names));
      normalizeSelections();
      applyTheme();
      applyVoice();
      populateAllSelects();
      draw();
    })();
  </script>
</body>
</html>
