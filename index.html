
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090b10">
  <title>Scoreboard</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --surface: #11151d;
      --surface2: #191f2a;
      --text: #f5f7ff;
      --muted: #8c96a8;
      --border: #293344;
      --accent: #38bdf8;
      --button: #202938;
    }

    body.light {
      color-scheme: light;
      --bg: #f1f4f9;
      --surface: #ffffff;
      --surface2: #e8edf5;
      --text: #131a27;
      --muted: #657084;
      --border: #d1d9e6;
      --accent: #087fc0;
      --button: #e0e7f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
      transition: background .25s, color .25s;
    }

    header {
      padding: 18px 10px 12px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .settings {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
      padding: 4px 12px 14px;
    }

    .label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input, button { font: inherit; }

    #target {
      width: 65px;
      padding: 8px;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      text-align: center;
      font-size: 16px;
    }

    .teams {
      display: flex;
      gap: 10px;
      padding: 0 10px;
      height: clamp(300px, 52vh, 520px);
    }

    .team {
      --team-color: #1680ff;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 12px 7px;
      border-radius: 18px;
      border: 4px solid var(--team-color);
      background: var(--surface);
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }

    #teamA { --team-color: #1680ff; }
    #teamB { --team-color: #ff4058; }

    .team-heading {
      position: relative;
      width: 100%;
      min-width: 0;
      margin: 0 0 8px;
      padding: 5px 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: clamp(15px, 4vw, 20px);
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .team-heading:active {
      opacity: .75;
      transform: scale(.98);
    }

    .player-selects {
      position: relative;
      width: 100%;
      min-width: 0;
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 8px;
      flex-shrink: 0;
    }

    .team.players-selected .team-heading {
      display: none;
    }

    .team.players-selected .player-selects {
      display: flex;
    }

    .team-name {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      width: 50%;
      min-width: 0;
      padding: 5px 3px;
      border: none;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      text-align: center;
      text-align-last: center;
      font-size: clamp(11px, 3.2vw, 16px);
      font-weight: 750;
      touch-action: manipulation;
    }

    .team-name:focus {
      border-bottom-color: var(--accent);
    }

    .team-name option {
      background: var(--surface);
      color: var(--text);
    }

    .player-selects::after {
      content: "|";
      position: absolute;
      left: 50%;
      top: 5px;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      pointer-events: none;
    }

    .score {
      color: var(--text);
      font-size: clamp(115px, 32vw, 210px);
      line-height: .95;
      font-weight: 950;
      letter-spacing: -6px;
      font-variant-numeric: tabular-nums;
      margin: auto 0;
    }

    .match-label {
      display: none;
      color: #ffd66b;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 1px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .team.match-point {
      animation: matchPointPulse .8s ease-in-out infinite alternate;
    }

    .team.match-point .match-label { display: block; }

    .team.won {
      border: 4px solid #ffd66b;
      box-shadow: 0 0 18px #ffd66b44;
      animation: winnerPulse 1.4s ease-in-out infinite alternate;
    }

    @keyframes matchPointPulse {
      from {
        box-shadow: 0 0 5px color-mix(in srgb, var(--team-color) 25%, transparent);
      }
      to {
        box-shadow: 0 0 23px color-mix(in srgb, var(--team-color) 85%, transparent);
      }
    }

    @keyframes winnerPulse {
      from { box-shadow: 0 0 8px #ffd66b33; }
      to { box-shadow: 0 0 26px #ffd66b77; }
    }

    #winner {
      display: none;
      margin: 14px 10px 4px;
      padding: 12px 8px;
      color: #ffd66b;
      font-size: clamp(20px, 5.5vw, 30px);
      font-weight: 950;
      letter-spacing: .5px;
    }

    #winner.show {
      display: block;
      animation: winnerIn .5s ease both,
                 winnerGlow 1.8s ease-in-out .5s infinite alternate;
    }

    @keyframes winnerIn {
      0% { opacity: 0; transform: scale(.65) translateY(10px); }
      65% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes winnerGlow {
      from { text-shadow: 0 0 5px #ffc94a55; }
      to { text-shadow: 0 0 24px #ffc94acc; }
    }

    .clock {
      margin: 17px 0 10px;
      font-size: clamp(38px, 10vw, 52px);
      line-height: 1.1;
      font-weight: 850;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    .controls, .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 12px;
    }

    button {
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--button);
      color: var(--text);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.97); }

    #start {
      min-width: 112px;
      background: #087d49;
      color: white;
      border-color: #0b9d60;
    }

    #resetMatch {
      background: #a92c38;
      color: white;
      border-color: #d13e4d;
    }

    #themeToggle {
      width: 42px;
      height: 40px;
      padding: 4px;
      color: var(--accent);
      font-size: 23px;
    }

    .footer {
      padding: 12px 10px 22px;
      color: var(--muted);
      font-size: 11px;
    }

    #playerPicker {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0009;
    }

    #playerPicker.open { display: flex; }

    .picker-card {
      width: min(100%, 340px);
      max-height: 80vh;
      overflow-y: auto;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      text-align: left;
      box-shadow: 0 18px 60px #0006;
    }

    .picker-title {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 900;
    }

    .picker-hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .picker-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .picker-option {
      width: 100%;
      padding: 12px 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text);
      text-align: center;
      overflow-wrap: anywhere;
    }

    .picker-option:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .picker-option.chosen {
      border-color: var(--accent);
      background: var(--accent);
      color: #06111b;
    }

    .picker-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    #pickerDone {
      background: #087d49;
      color: white;
      border-color: #0b9d60;
    }

    @media (max-height: 650px) {
      header { padding-top: 9px; padding-bottom: 7px; }
      .settings { padding-bottom: 8px; }
      .teams { height: 44vh; min-height: 220px; }
      .clock { margin-top: 10px; }
      .score { font-size: clamp(95px, 27vw, 165px); }
      .footer { padding-bottom: 10px; }
    }

    @media (max-width: 360px) {
      .teams {
        gap: 7px;
        padding-left: 7px;
        padding-right: 7px;
      }

      .team { padding-left: 5px; padding-right: 5px; }
      .score { font-size: clamp(90px, 26vw, 135px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>SCOREBOARD</header>

  <div class="settings">
    <label class="label" for="target">Target</label>
    <input id="target" type="number" min="1" max="999" value="21" inputmode="numeric">
    <button id="themeToggle" type="button" aria-label="Toggle theme">☀</button>
  </div>

  <main>
    <div class="teams">
      <section id="teamA" class="team" aria-label="Team A">
        <button id="headingA" class="team-heading" type="button">Team A</button>
        <div class="player-selects">
          <select id="nameA1" class="team-name" aria-label="Team A first player"></select>
          <select id="nameA2" class="team-name" aria-label="Team A second player"></select>
        </div>
        <div id="scoreA" class="score">0</div>
        <div class="match-label">MATCH POINT!</div>
      </section>

      <section id="teamB" class="team" aria-label="Team B">
        <button id="headingB" class="team-heading" type="button">Team B</button>
        <div class="player-selects">
          <select id="nameB1" class="team-name" aria-label="Team B first player"></select>
          <select id="nameB2" class="team-name" aria-label="Team B second player"></select>
        </div>
        <div id="scoreB" class="score">0</div>
        <div class="match-label">MATCH POINT!</div>
      </section>
    </div>

    <div id="winner" role="status" aria-live="polite"></div>
    <div id="time" class="clock" aria-label="Elapsed match time">00:00</div>

    <div class="controls">
      <button id="start" type="button">▶ Start</button>
      <button id="resetClock" type="button">↺ Reset Clock</button>
    </div>

    <div class="actions">
      <button id="swap" type="button">⇄ Swap Court</button>
      <button id="resetMatch" type="button">↻ Reset Match</button>
    </div>
  </main>

  <div class="footer">
    Tap a team panel to add a point. Swipe up to add or down to subtract.
  </div>

  <div id="playerPicker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="picker-card">
      <h2 id="pickerTitle" class="picker-title">Select players</h2>
      <p class="picker-hint">Choose two different players.</p>
      <div id="pickerList" class="picker-list"></div>
      <div class="picker-actions">
        <button id="pickerCancel" type="button">Cancel</button>
        <button id="pickerDone" type="button">Done</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);

      const STORAGE = {
        names: 'scoreboardTeamNameList_v3',
        a1: 'scoreboardSelectedA1_v1',
        a2: 'scoreboardSelectedA2_v1',
        b1: 'scoreboardSelectedB1_v1',
        b2: 'scoreboardSelectedB2_v1',
        target: 'scoreboardTarget_v2',
        theme: 'scoreboardTheme_v2'
      };

      const DEFAULT_NAMES = [
        'Ching', 'Dayang', 'Ee', 'Gadi',
        'Igat', 'Jessica', 'Lulong', 'Via'
      ];

      function read(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch (_) {
          return fallback;
        }
      }

      function readJSON(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : JSON.parse(value);
        } catch (_) {
          return fallback;
        }
      }

      function save(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_) {}
      }

      let names = readJSON(STORAGE.names, null);

      if (!Array.isArray(names)) {
        const v2 = readJSON('scoreboardTeamNames_v2', null);
        const v1 = readJSON('scoreboardTeamNames_v1', null);
        names = Array.isArray(v2) ? v2 :
                Array.isArray(v1) ? v1 : [...DEFAULT_NAMES];
      }

      names = [...new Set(
        names
          .filter(name => typeof name === 'string')
          .map(name => name.trim())
          .filter(name => name && name.toLowerCase() !== 'naz')
      )].sort((x, y) =>
        x.localeCompare(y, undefined, { sensitivity: 'base' })
      );

      if (names.length < 4) names = [...DEFAULT_NAMES];

      let selected = {
        a1: read(STORAGE.a1, ''),
        a2: read(STORAGE.a2, ''),
        b1: read(STORAGE.b1, ''),
        b2: read(STORAGE.b2, '')
      };

      let a = 0;
      let b = 0;
      let elapsedMs = 0;
      let running = false;
      let runStartedAt = 0;
      let winner = null;
      let audioContext = null;
      let pickerSide = 'a';
      let draftPlayers = [];

      let target = Math.max(
        1,
        Math.min(999, parseInt(read(STORAGE.target, '21'), 10) || 21)
      );

      let theme = read(STORAGE.theme, 'dark');
      $('target').value = target;

      function pairName(side) {
        const first = selected[side + '1'];
        const second = selected[side + '2'];

        if (first && second) return first + ' & ' + second;
        return side === 'a' ? 'Team A' : 'Team B';
      }

      function saveSelections() {
        Object.keys(selected).forEach(key => {
          save(STORAGE[key], selected[key]);
        });
      }

      function allOtherSelections(side) {
        return Object.entries(selected)
          .filter(([key]) => key[0] !== side)
          .map(([, name]) => name)
          .filter(Boolean);
      }

      function populateSelect(id, key) {
        const select = $(id);
        const current = selected[key];
        const used = Object.entries(selected)
          .filter(([otherKey]) => otherKey !== key)
          .map(([, name]) => name)
          .filter(Boolean);

        select.innerHTML = '';

        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Choose';
        placeholder.disabled = true;
        select.appendChild(placeholder);

        names.forEach(name => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          option.disabled = used.includes(name) && name !== current;
          select.appendChild(option);
        });

        select.value = current || '';
      }

      function populateAllSelects() {
        populateSelect('nameA1', 'a1');
        populateSelect('nameA2', 'a2');
        populateSelect('nameB1', 'b1');
        populateSelect('nameB2', 'b2');
        saveSelections();
        updateHeadings();
      }

      function updateHeadings() {
        $('headingA').textContent =
          selected.a1 && selected.a2 ? pairName('a') : 'Team A';

        $('headingB').textContent =
          selected.b1 && selected.b2 ? pairName('b') : 'Team B';

        $('teamA').classList.toggle(
          'players-selected',
          Boolean(selected.a1 && selected.a2)
        );

        $('teamB').classList.toggle(
          'players-selected',
          Boolean(selected.b1 && selected.b2)
        );
      }

      function openPicker(side) {
        pickerSide = side;
        draftPlayers = [
          selected[side + '1'] || '',
          selected[side + '2'] || ''
        ];

        $('pickerTitle').textContent =
          side === 'a' ? 'Select Team A players' : 'Select Team B players';

        renderPicker();
        $('playerPicker').classList.add('open');
      }

      function renderPicker() {
        const list = $('pickerList');
        list.innerHTML = '';

        names.forEach(name => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'picker-option';
          button.textContent = name;

          const chosenIndex = draftPlayers.indexOf(name);
          if (chosenIndex !== -1) {
            button.classList.add('chosen');
            button.textContent = name + (chosenIndex === 0 ? '  1' : '  2');
          }

          const usedByOtherTeam = allOtherSelections(pickerSide).includes(name);
          button.disabled = usedByOtherTeam;

          button.addEventListener('click', () => {
            const existingIndex = draftPlayers.indexOf(name);

            if (existingIndex !== -1) {
              draftPlayers[existingIndex] = '';
            } else if (!draftPlayers[0]) {
              draftPlayers[0] = name;
            } else if (!draftPlayers[1]) {
              draftPlayers[1] = name;
            } else {
              draftPlayers[0] = draftPlayers[1];
              draftPlayers[1] = name;
            }

            renderPicker();
          });

          list.appendChild(button);
        });

        $('pickerDone').disabled =
          !draftPlayers[0] || !draftPlayers[1] ||
          draftPlayers[0] === draftPlayers[1];
      }

      function closePicker() {
        $('playerPicker').classList.remove('open');
      }

      $('headingA').addEventListener('click', () => openPicker('a'));
      $('headingB').addEventListener('click', () => openPicker('b'));

      $('pickerCancel').addEventListener('click', closePicker);

      $('playerPicker').addEventListener('click', event => {
        if (event.target === $('playerPicker')) closePicker();
      });

      $('pickerDone').addEventListener('click', () => {
        if (
          !draftPlayers[0] ||
          !draftPlayers[1] ||
          draftPlayers[0] === draftPlayers[1]
        ) return;

        selected[pickerSide + '1'] = draftPlayers[0];
        selected[pickerSide + '2'] = draftPlayers[1];

        populateAllSelects();
        closePicker();
        draw();
      });

      [
        ['nameA1', 'a1'], ['nameA2', 'a2'],
        ['nameB1', 'b1'], ['nameB2', 'b2']
      ].forEach(([id, key]) => {
        $(id).addEventListener('change', () => {
          const newName = $(id).value;

          const duplicate = Object.entries(selected).some(
            ([otherKey, name]) => otherKey !== key && name === newName
          );

          if (duplicate) {
            populateAllSelects();
            return;
          }

          selected[key] = newName;
          populateAllSelects();
          draw();
        });
      });

      function getElapsedMs() {
        return running
          ? elapsedMs + Math.max(0, Date.now() - runStartedAt)
          : elapsedMs;
      }

      function formatTime(milliseconds) {
        const total = Math.floor(milliseconds / 1000);
        return String(Math.floor(total / 60)).padStart(2, '0') + ':' +
          String(total % 60).padStart(2, '0');
      }

      function pauseClock() {
        if (running) elapsedMs = getElapsedMs();
        running = false;
      }

      function playMatchPointSound() {
        try {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) return;
          if (!audioContext) audioContext = new AudioContextClass();

          const play = () => {
            const now = audioContext.currentTime;

            [880, 1175].forEach((frequency, index) => {
              const oscillator = audioContext.createOscillator();
              const gain = audioContext.createGain();
              const startAt = now + index * 0.16;

              oscillator.type = 'sine';
              oscillator.frequency.value = frequency;

              gain.gain.setValueAtTime(0.0001, startAt);
              gain.gain.exponentialRampToValueAtTime(0.14, startAt + 0.025);
              gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.13);

              oscillator.connect(gain);
              gain.connect(audioContext.destination);
              oscillator.start(startAt);
              oscillator.stop(startAt + 0.14);
            });
          };

          if (audioContext.state === 'suspended') {
            audioContext.resume().then(play).catch(() => {});
          } else {
            play();
          }
        } catch (_) {}
      }

      function checkWinner() {
        if (winner) return;

        if (a >= target) winner = 'a';
        else if (b >= target) winner = 'b';

        if (winner) pauseClock();
      }

      function draw() {
        $('scoreA').textContent = a;
        $('scoreB').textContent = b;
        $('time').textContent = formatTime(getElapsedMs());
        $('start').textContent = running ? 'Ⅱ Pause' : '▶ Start';

        $('teamA').classList.toggle('won', winner === 'a');
        $('teamB').classList.toggle('won', winner === 'b');

        $('teamA').classList.toggle(
          'match-point',
          !winner && a === target - 1
        );

        $('teamB').classList.toggle(
          'match-point',
          !winner && b === target - 1
        );

        const banner = $('winner');

        if (winner) {
          const message = '🏆 ' + pairName(winner) + ' WINS!';

          if (banner.textContent !== message) {
            banner.textContent = message;
            banner.classList.remove('show');
            void banner.offsetWidth;
            banner.classList.add('show');
          } else {
            banner.classList.add('show');
          }
        } else {
          banner.textContent = '';
          banner.classList.remove('show');
        }
      }

      function change(side, delta) {
        if (winner) return;

        const oldMatchA = a === target - 1;
        const oldMatchB = b === target - 1;

        if (side === 'a') a = Math.max(0, a + delta);
        else b = Math.max(0, b + delta);

        checkWinner();

        if (!winner) {
          const newMatchA = a === target - 1;
          const newMatchB = b === target - 1;

          if (
            (!oldMatchA && newMatchA) ||
            (!oldMatchB && newMatchB)
          ) {
            playMatchPointSound();
          }
        }

        draw();
      }

      function setupSwipe(id, side) {
        const el = $(id);
        let start = null;

        el.addEventListener('pointerdown', event => {
          if (event.target.closest('select, input, button')) {
            start = null;
            return;
          }

          if (event.pointerType === 'mouse' && event.button !== 0) {
            start = null;
            return;
          }

          start = {
            x: event.clientX,
            y: event.clientY,
            time: Date.now()
          };
        });

        el.addEventListener('pointerup', event => {
          if (!start) return;

          const dx = event.clientX - start.x;
          const dy = event.clientY - start.y;
          const duration = Date.now() - start.time;
          start = null;

          if (event.target.closest('select, input, button')) return;

          if (Math.abs(dy) > 25 && Math.abs(dy) > Math.abs(dx)) {
            change(side, dy < 0 ? 1 : -1);
          } else if (
            Math.abs(dx) < 12 &&
            Math.abs(dy) < 12 &&
            duration < 500
          ) {
            change(side, 1);
          }
        });

        el.addEventListener('pointercancel', () => {
          start = null;
        });
      }

      setupSwipe('teamA', 'a');
      setupSwipe('teamB', 'b');

      $('start').addEventListener('click', () => {
        if (winner) return;

        if (running) {
          pauseClock();
        } else {
          runStartedAt = Date.now();
          running = true;
        }

        draw();
      });

      setInterval(draw, 100);

      $('resetClock').addEventListener('click', () => {
        running = false;
        elapsedMs = 0;
        runStartedAt = 0;
        draw();
      });

      $('swap').addEventListener('click', () => {
        [a, b] = [b, a];

        const old = { ...selected };
        selected.a1 = old.b1;
        selected.a2 = old.b2;
        selected.b1 = old.a1;
        selected.b2 = old.a2;

        const colorA = getComputedStyle($('teamA'))
          .getPropertyValue('--team-color').trim();

        const colorB = getComputedStyle($('teamB'))
          .getPropertyValue('--team-color').trim();

        $('teamA').style.setProperty('--team-color', colorB);
        $('teamB').style.setProperty('--team-color', colorA);

        if (winner) winner = winner === 'a' ? 'b' : 'a';

        populateAllSelects();
        draw();
      });

      $('resetMatch').addEventListener('click', () => {
        if (!confirm('Reset both scores and the match clock?')) return;

        a = 0;
        b = 0;
        elapsedMs = 0;
        running = false;
        runStartedAt = 0;
        winner = null;

        draw();
      });

      $('target').addEventListener('change', () => {
        const value = Number($('target').value);

        target = Number.isFinite(value) && value >= 1
          ? Math.min(999, Math.floor(value))
          : 21;

        save(STORAGE.target, String(target));
        winner = null;
        checkWinner();
        draw();
      });

      function applyTheme() {
        document.body.classList.toggle('light', theme === 'light');

        $('themeToggle').textContent = theme === 'dark' ? '☀' : '☾';

        $('themeToggle').setAttribute(
          'aria-label',
          theme === 'dark'
            ? 'Switch to light theme'
            : 'Switch to dark theme'
        );

        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f1f4f9' : '#090b10';

        save(STORAGE.theme, theme);
      }

      $('themeToggle').addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        applyTheme();
      });

      applyTheme();
      populateAllSelects();
      draw();
    })();
  </script>
</body>
</html>
